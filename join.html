<!doctype html>
<!-- Table invites from Callbreak (Assets/Scripts/Online/Invites.cs). Published next to the privacy policy at
     https://nishantaneupane.github.io/callbreakpolicy/join.html?code=ROOMCODE
     On Android it opens callbreak://join/ROOMCODE; without Callbreak installed, Chrome falls back to the web version at
     that table (https://nishantaneupane.github.io/callbreak/?code=ROOMCODE). The Play Store link carries the code as an
     install referrer, so a player who installs first still lands at the table. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join my Callbreak table</title>
<meta property="og:title" content="Join my Callbreak table">
<meta property="og:description" content="Tap to sit at my table in Callbreak, the Nepali card game of calls and tricks.">
<meta property="og:image" content="https://nishantaneupane.github.io/callbreak/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://nishantaneupane.github.io/callbreak/favicon.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: radial-gradient(circle at 50% 30%, #3fa2f0, #11408a 75%); color: #f5f9ff;
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(420px, calc(100% - 32px)); text-align: center; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #d4e2f7; }
  .code { display: inline-block; margin: 6px 0 22px; padding: 8px 18px; border-radius: 999px;
          background: rgba(13,43,94,.45); color: #ffc93c; font-weight: 700; letter-spacing: .12em; font-size: 22px; }
  a.btn { display: block; padding: 15px; border-radius: 14px; text-decoration: none; font-weight: 700; margin-bottom: 12px; }
  .primary { background: #ffc93c; color: #0d2b5e; }
  .ghost { border: 1px solid rgba(255,255,255,.35); color: #f5f9ff; }
  small { color: #b8cbe8; }
  img.icon { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(5,20,60,.45); }
</style>
</head>
<body>
<main>
  <img class="icon" src="https://nishantaneupane.github.io/callbreak/favicon.png" alt="">
  <h1>Join my Callbreak table</h1>
  <p>Your friend is waiting at a private table.</p>
  <div class="code" id="code">—</div>
  <a class="btn primary" id="open" href="#">Open Callbreak and sit down</a>
  <a class="btn primary" id="web" href="https://nishantaneupane.github.io/callbreak/">Play in your browser</a>
  <a class="btn ghost" id="store" href="#">Get Callbreak on Google Play</a>
  <small>Already have Callbreak? You can also type the code in Private Table.</small>
</main>
<script>
  const pkg = "com.lampsoftnepal.callbreak";
  const code = (new URLSearchParams(location.search).get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
  const store = "https://play.google.com/store/apps/details?id=" + pkg + (code ? "&referrer=" + encodeURIComponent("join=" + code) : "");
  const android = /Android/i.test(navigator.userAgent);
  const web = "https://nishantaneupane.github.io/callbreak/" + (code ? "?code=" + code : "");
  const intent = "intent://join/" + code + "#Intent;scheme=callbreak;package=" + pkg +
                 ";S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  document.getElementById("web").href = web;
  document.getElementById("code").textContent = code || "—";
  document.getElementById("store").href = store;
  const open = document.getElementById("open");
  if (code && android) {
    open.href = intent;
    document.getElementById("web").className = "btn ghost";
    location.href = intent; // straight into the app (or, without it, the web version at this table)
  } else {
    open.style.display = "none";
  }
</script>
</body>
</html>
